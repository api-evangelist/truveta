aid: truveta
name: Truveta
description: 'Truveta is a health-system-led data and analytics company founded in 2020
  and headquartered in Bellevue, Washington, jointly owned by 30 US health systems.
  It aggregates daily-updated, de-identified electronic health record data covering
  more than 120 million US patients, links it with claims, mortality and genomic data,
  and delivers it as regulatory-grade real-world evidence through Truveta Data and
  Truveta Studio, a HIPAA-compliant analytics workspace combining serverless SQL with
  Jupyter notebooks in R and Python. The Truveta Language Model normalizes unstructured
  clinical text into research-ready concepts, and the Truveta Genome Project links
  de-identified genetic data to the same longitudinal records. Truveta publishes no
  public API, developer portal or machine-readable specification: Truveta Studio is
  reachable only through an authenticated customer tenant at studio.truveta.com.'
