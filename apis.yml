x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    Truveta ships no developer surface at all — developer.truveta.com and
    docs.truveta.com do not resolve, and the only product entry point,
    studio.truveta.com, 302s straight into an Auth0 universal login at
    login.truveta.com, so the API reference (if one exists) requires a signed
    health-system or life-science subscription to reach.
  evidence:
    - url: https://studio.truveta.com/
      status: 302
    - url: https://developer.truveta.com/
      status: 0
    - url: https://docs.truveta.com/
      status: 0
    - url: https://api.truveta.com/openapi.json
      status: 404
  checked: '2026-08-05'
  x-notes: >-
    developer./docs. return status 0 = DNS NXDOMAIN, not an HTTP error.
    api.truveta.com is a live Kong API gateway — every spec path returns Kong's
    "no Route matched with those values" 404, identical to a nonsense control
    path, so the API tier exists but publishes no anonymous route. Separately,
    api.truveta.com answers /.well-known/* with a 200 Studio SPA HTML shell;
    those 200s are soft-404s and were rejected as evidence. See
    well-known/truveta-well-known.yml.
